<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="HQ — your personal command center. Attention, not information.">
<title>HQ — Command Center</title>
<link rel="manifest" href="kova-manifest.json">
<link rel="icon" href="kova-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="kova-icon.svg">
<style>
/* ============================================================================
   HQ design system — dark-first "private family office" aesthetic.
   Palette roles follow the validated reference dataviz palette (dark mode).
   ========================================================================== */
:root {
  color-scheme: dark;
  /* surfaces & ink */
  --page: #0d0d0d;
  --surface: #1a1a19;
  --raised: #222220;
  --overlay: #262624;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --hairline: rgba(255,255,255,0.10);
  --hairline-soft: rgba(255,255,255,0.06);
  --grid: #2c2c2a;
  --baseline: #383835;
  /* categorical series slots (fixed order — identity follows entity) */
  --s0: #3987e5; --s1: #008300; --s2: #d55181; --s3: #c98500;
  --s4: #199e70; --s5: #d95926; --s6: #9085e9; --s7: #e66767;
  /* status (reserved — never used as series colors) */
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --accent: #3987e5;
  --accent-soft: rgba(57,135,229,0.14);
  --radius: 12px;
  --radius-sm: 8px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --sidebar-w: 224px;
  --shadow: 0 8px 32px rgba(0,0,0,0.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--ink);
  font-family: var(--font); font-size: 14.5px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
::selection { background: rgba(57,135,229,0.35); }
a { color: var(--accent); text-decoration: none; }
h1,h2,h3,h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
button { font-family: inherit; }
input, select, textarea {
  font-family: inherit; font-size: 14px; color: var(--ink);
  background: var(--raised); border: 1px solid var(--hairline);
  border-radius: var(--radius-sm); padding: 8px 10px; outline: none;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
label { font-size: 12px; color: var(--ink-3); display: block; margin: 10px 0 4px; }
kbd {
  font-family: inherit; font-size: 11px; color: var(--ink-2);
  border: 1px solid var(--hairline); border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 6px; background: var(--raised);
}
.mono, .money, td.num, .num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.spacer { flex: 1; }
.nowrap { white-space: nowrap; }

/* ---- app frame ---------------------------------------------------------- */
#app { display: flex; min-height: 100dvh; }
#sidebar {
  width: var(--sidebar-w); flex: none; position: sticky; top: 0; height: 100dvh;
  display: flex; flex-direction: column; padding: 14px 10px;
  border-right: 1px solid var(--hairline-soft); background: #111110;
}
.logo { display: flex; align-items: center; gap: 9px; padding: 6px 10px 14px; }
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: linear-gradient(135deg, #3987e5, #9085e9);
  display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff;
}
.logo-name { font-weight: 750; letter-spacing: 0.02em; }
.logo-name span { color: var(--ink-3); font-weight: 500; }
.nav { flex: 1; overflow-y: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-section { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3); padding: 12px 10px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px; margin: 1px 0; border: 0; background: none; text-align: left;
  border-radius: var(--radius-sm); color: var(--ink-2); font-size: 13.5px; cursor: pointer;
}
.nav-item:hover { background: var(--surface); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: #cfe3fb; }
.nav-item .ico { width: 18px; text-align: center; flex: none; opacity: 0.9; }
.nav-item .count {
  margin-left: auto; font-size: 11px; color: var(--ink-3);
  background: var(--raised); border-radius: 99px; padding: 0 7px; line-height: 18px;
}
.nav-item.active .count { background: rgba(57,135,229,0.25); color: #cfe3fb; }
#sidebar .foot { padding: 8px 4px 2px; border-top: 1px solid var(--hairline-soft); }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 8px;
  padding: 10px 18px; background: rgba(13,13,13,0.86); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hairline-soft);
}
#topbar .crumb { font-weight: 650; font-size: 15.5px; }
#topbar .crumb .muted { font-weight: 450; }
.icon-btn {
  position: relative; display: grid; place-items: center; width: 34px; height: 34px;
  border-radius: 9px; border: 1px solid var(--hairline-soft); background: var(--surface);
  color: var(--ink-2); cursor: pointer; font-size: 15px;
}
.icon-btn:hover { border-color: var(--hairline); color: var(--ink); }
.icon-btn .bub {
  position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px;
  border-radius: 99px; background: var(--crit); color: #fff; font-size: 10px;
  font-weight: 700; display: grid; place-items: center; padding: 0 4px;
}
.icon-btn .bub.accent { background: var(--accent); }
.searchbar {
  flex: 1; max-width: 430px; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--hairline-soft); background: var(--surface);
  border-radius: 9px; padding: 7px 12px; color: var(--ink-3); cursor: pointer; font-size: 13px;
}
.searchbar:hover { border-color: var(--hairline); }
.searchbar kbd { margin-left: auto; }
.ai-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ink-3); flex: none; }
.ai-dot.on { background: var(--good); box-shadow: 0 0 8px rgba(12,163,12,0.8); }
.ai-pill {
  display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3);
  border: 1px solid var(--hairline-soft); background: var(--surface);
  padding: 7px 11px; border-radius: 9px; cursor: pointer;
}
.ai-pill:hover { color: var(--ink-2); border-color: var(--hairline); }

#screen { padding: 18px; max-width: 1240px; width: 100%; margin: 0 auto; padding-bottom: 90px; }

/* ---- mobile tab bar ------------------------------------------------------ */
#tabbar {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  background: rgba(17,17,16,0.92); backdrop-filter: blur(14px);
  border-top: 1px solid var(--hairline-soft);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  grid-template-columns: repeat(5, 1fr); gap: 4px;
}
.tab-item {
  border: 0; background: none; color: var(--ink-3); font-size: 10.5px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0;
  border-radius: 10px;
}
.tab-item .ico { font-size: 19px; line-height: 1; }
.tab-item.active { color: #cfe3fb; }
.tab-item.capture .ico {
  width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
  background: linear-gradient(135deg, #3987e5, #9085e9); color: #fff; font-size: 22px;
  margin-top: -14px; box-shadow: 0 6px 20px rgba(57,135,229,0.4);
}

/* ---- cards & grids ------------------------------------------------------- */
.grid { display: grid; gap: 12px; }
.cols-2 { grid-template-columns: repeat(2, 1fr); }
.cols-3 { grid-template-columns: repeat(3, 1fr); }
.cols-4 { grid-template-columns: repeat(4, 1fr); }
.card {
  background: var(--surface); border: 1px solid var(--hairline-soft);
  border-radius: var(--radius); padding: 14px 16px; min-width: 0;
}
.card.pad-0 { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.card-head h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); font-weight: 650; }
.card-head .link { margin-left: auto; font-size: 12px; cursor: pointer; color: var(--accent); background: none; border: 0; }
.metric { padding: 12px 14px; }
.metric .k { font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.metric .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 3px; }
.metric .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.metric.tappable { cursor: pointer; }
.metric.tappable:hover { border-color: var(--hairline); }

/* ---- badges, chips, status ---------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650;
  border-radius: 99px; padding: 2px 9px; border: 1px solid transparent; white-space: nowrap;
}
.badge.green   { color: #7fd97f; background: rgba(12,163,12,0.13); }
.badge.amber   { color: #ffd479; background: rgba(250,178,25,0.12); }
.badge.serious { color: #ffb597; background: rgba(236,131,90,0.13); }
.badge.red     { color: #f1a1a1; background: rgba(208,59,59,0.15); }
.badge.gray    { color: var(--ink-3); background: rgba(255,255,255,0.06); }
.badge.blue    { color: #a9cdf6; background: var(--accent-soft); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  border: 1px solid var(--hairline); border-radius: 99px; padding: 3px 11px;
  background: none; color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--ink-3); }
.chip.on { background: var(--accent-soft); border-color: rgba(57,135,229,0.5); color: #cfe3fb; }
.chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex: none; }
.wsdot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* ---- buttons ------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--hairline); background: var(--raised); color: var(--ink);
  cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #4d93ea; }
.btn.danger { color: #f1a1a1; border-color: rgba(208,59,59,0.4); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: var(--surface); }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---- lists & rows -------------------------------------------------------- */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 10px; padding: 9px 4px;
  border-bottom: 1px solid var(--hairline-soft); min-width: 0;
}
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 13.5px; }
.meta { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.clickable { cursor: pointer; margin: 0 -8px; padding: 9px 8px; border-radius: 8px; }
.row.clickable:hover { background: var(--raised); }
.row.done .title { text-decoration: line-through; color: var(--ink-3); }
.check {
  width: 19px; height: 19px; flex: none; border-radius: 7px; cursor: pointer;
  border: 1.5px solid var(--ink-3); background: none; display: grid; place-items: center;
  color: transparent; font-size: 12px;
}
.check.on { background: var(--good); border-color: var(--good); color: #fff; }

/* ---- attention feed ------------------------------------------------------ */
.feed-item { display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--hairline-soft); }
.feed-item:last-child { border-bottom: 0; }
.feed-rail { width: 3px; border-radius: 3px; flex: none; align-self: stretch; }
.feed-body { flex: 1; min-width: 0; }
.feed-what { font-size: 13.5px; font-weight: 600; }
.feed-why { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.feed-act { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }

/* ---- tables -------------------------------------------------------------- */
.tablewrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 650; padding: 7px 10px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--hairline-soft); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--raised); }

/* ---- progress ------------------------------------------------------------ */
.bar { height: 6px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

/* ---- pipeline / kanban ---------------------------------------------------- */
.pipe { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.pipe-col { min-width: 240px; width: 240px; flex: none; background: var(--surface); border: 1px solid var(--hairline-soft); border-radius: var(--radius); padding: 10px; }
.pipe-col h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); padding: 2px 4px 8px; display: flex; }
.pipe-card { background: var(--raised); border: 1px solid var(--hairline-soft); border-radius: 10px; padding: 10px 11px; margin-bottom: 8px; cursor: pointer; }
.pipe-card:hover { border-color: var(--hairline); }

/* ---- timeline (today) ----------------------------------------------------- */
.tl { position: relative; padding-left: 62px; }
.tl-item { position: relative; padding: 7px 0 7px 16px; border-left: 2px solid var(--grid); }
.tl-item .t { position: absolute; left: -62px; width: 46px; text-align: right; font-size: 11px; color: var(--ink-3); top: 9px; font-variant-numeric: tabular-nums; }
.tl-item::before { content: ''; position: absolute; left: -6px; top: 12px; width: 10px; height: 10px; border-radius: 99px; background: var(--baseline); border: 2px solid var(--page); }
.tl-item.now::before { background: var(--accent); box-shadow: 0 0 8px rgba(57,135,229,0.9); }
.tl-item.conflict::before { background: var(--crit); }

/* ---- modal / sheets ------------------------------------------------------- */
.modal-back {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6);
  display: flex; align-items: flex-start; justify-content: center; padding: 7vh 14px 14px;
  backdrop-filter: blur(3px); overflow-y: auto;
}
.modal {
  background: var(--overlay); border: 1px solid var(--hairline); border-radius: 16px;
  width: 100%; max-width: 620px; box-shadow: var(--shadow); padding: 18px 20px;
  max-height: 84dvh; overflow-y: auto;
}
.modal.wide { max-width: 860px; }
.modal h2 { font-size: 17px; margin-bottom: 4px; }
.modal .sub { color: var(--ink-3); font-size: 12.5px; margin-bottom: 12px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ---- command palette ------------------------------------------------------ */
.palette { max-width: 560px; padding: 0; overflow: hidden; }
.palette input { border: 0; border-radius: 0; background: none; padding: 15px 18px; font-size: 15px; border-bottom: 1px solid var(--hairline); }
.pal-list { max-height: 46dvh; overflow-y: auto; padding: 6px; }
.pal-sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); padding: 8px 12px 3px; }
.pal-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 9px; cursor: pointer; font-size: 13.5px; }
.pal-item .meta { margin-left: auto; font-size: 11px; color: var(--ink-3); }
.pal-item.sel, .pal-item:hover { background: var(--accent-soft); }

/* ---- toasts ---------------------------------------------------------------- */
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--overlay); border: 1px solid var(--hairline); color: var(--ink);
  border-radius: 10px; padding: 9px 16px; font-size: 13px; box-shadow: var(--shadow);
  animation: toast-in 0.18s ease-out;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ---- copilot panel ---------------------------------------------------------- */
#copilot-fab {
  position: fixed; right: 18px; bottom: 18px; z-index: 70;
  width: 48px; height: 48px; border-radius: 16px; border: 0; cursor: pointer;
  background: linear-gradient(135deg, #3987e5, #9085e9); color: #fff; font-size: 21px;
  box-shadow: 0 8px 28px rgba(57,135,229,0.45); display: grid; place-items: center;
}
#copilot {
  position: fixed; right: 14px; bottom: 14px; z-index: 90; width: min(400px, calc(100vw - 28px));
  height: min(560px, calc(100dvh - 60px)); background: var(--overlay);
  border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow);
  display: none; flex-direction: column; overflow: hidden;
}
#copilot.open { display: flex; }
.cp-head { display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-bottom: 1px solid var(--hairline-soft); }
.cp-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.cp-msg { max-width: 88%; border-radius: 12px; padding: 8px 12px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.cp-msg.user { align-self: flex-end; background: var(--accent-soft); border: 1px solid rgba(57,135,229,0.3); }
.cp-msg.ai { align-self: flex-start; background: var(--raised); border: 1px solid var(--hairline-soft); }
.cp-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--hairline-soft); }
.cp-foot textarea { resize: none; height: 40px; }

/* ---- charts ------------------------------------------------------------------ */
.viz { position: relative; }
.viz svg { display: block; width: 100%; height: auto; }
.viz .tip {
  position: absolute; pointer-events: none; z-index: 5; display: none;
  background: var(--overlay); border: 1px solid var(--hairline); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap;
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); margin-top: 8px; }
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.spark { vertical-align: middle; }

/* ---- misc ---------------------------------------------------------------------- */
.privacy-on .money { filter: blur(7px); user-select: none; }
.section-gap { margin-top: 14px; }
.two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; align-items: start; }
.detail-back { font-size: 12.5px; color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0 0 10px; display: inline-flex; gap: 6px; align-items: center; }
.empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 26px 10px; }
.divider { border: 0; border-top: 1px solid var(--hairline-soft); margin: 12px 0; }
.seg { display: inline-flex; background: var(--raised); border: 1px solid var(--hairline-soft); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--ink-3); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--overlay); color: var(--ink); border: 1px solid var(--hairline-soft); }
.callout { border: 1px solid rgba(57,135,229,0.35); background: var(--accent-soft); border-radius: var(--radius-sm); padding: 10px 13px; font-size: 12.5px; }
.callout.warn { border-color: rgba(250,178,25,0.35); background: rgba(250,178,25,0.08); }
.callout.crit { border-color: rgba(208,59,59,0.4); background: rgba(208,59,59,0.1); }
pre.code { background: var(--page); border: 1px solid var(--hairline-soft); border-radius: 8px; padding: 10px 12px; font-size: 12px; overflow-x: auto; color: var(--ink-2); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.readiness-ring { display: grid; place-items: center; position: relative; }
.readiness-ring .val { position: absolute; font-weight: 750; font-size: 18px; }

/* ---- responsive ------------------------------------------------------------------ */
@media (max-width: 1020px) {
  .cols-4 { grid-template-columns: repeat(2, 1fr); }
  .cols-3 { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  #sidebar { display: none; }
  #tabbar { display: grid; }
  #screen { padding: 12px; padding-bottom: 110px; }
  .cols-2, .cols-3 { grid-template-columns: 1fr; }
  .cols-4 { grid-template-columns: repeat(2, 1fr); }
  #topbar { padding: 8px 12px; }
  .searchbar { max-width: none; }
  .searchbar kbd { display: none; }
  #topbar .crumb { display: none; }
  #copilot-fab { bottom: 84px; }
  #copilot { bottom: 80px; height: min(520px, calc(100dvh - 120px)); }
  .modal-back { padding: 4vh 8px 8px; }
  .proj-chip { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Primary navigation"></aside>
