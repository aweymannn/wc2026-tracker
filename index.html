<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>⚽ World Cup 2026 Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#18a34a;--gold:#f59e0b;--red:#dc2626;
  --card:#0e1f11;--card-border:#1e3d22;
  --text:#dde8de;--muted:#6b8f72;--dim:#3d6344;
  --bg:#07130a;--bg2:#0b1f0e;
}
html{scroll-behavior:smooth}
body{background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--text);min-height:100vh}
.hf{font-family:'Barlow Condensed',system-ui,sans-serif}
button{cursor:pointer;border:none;font-family:inherit;background:none}
a{color:var(--gold)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#1e3d22;border-radius:3px}

/* ── HEADER ─────────────────────────────────────────── */
#header{background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--card-border);padding:0 20px;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
#header-inner{max-width:1280px;margin:0 auto}
#header-top{display:flex;align-items:center;gap:14px;padding:14px 0 10px;flex-wrap:wrap}
.title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:#fff;letter-spacing:-.3px;line-height:1}
.subtitle{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 9px;border-radius:20px}
.pill-ok{background:#16a34a1a;color:#4ade80;border:1px solid #16a34a33}
.pill-warn{background:#f59e0b1a;color:#fcd34d;border:1px solid #f59e0b33}
.pill-live{background:#dc26261a;color:#f87171;border:1px solid #dc262633;animation:pulse 1.5s ease-in-out infinite}
#last-upd{font-size:10px;color:var(--dim)}
#refresh-btn{background:var(--green);color:#fff;padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;transition:all .15s;letter-spacing:.02em}
#refresh-btn:hover{background:#16a34a;transform:translateY(-1px)}
#refresh-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ── TABS ────────────────────────────────────────────── */
#tabs{display:flex;gap:1px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;padding:9px 15px;border-radius:5px 5px 0 0;transition:all .15s;white-space:nowrap;color:var(--muted)}
.tab.active{background:var(--green);color:#fff}
.tab:not(.active):hover{background:#132819;color:var(--text)}

/* ── MAIN ────────────────────────────────────────────── */
#main{max-width:1280px;margin:0 auto;padding:18px 20px}
.page{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .7s linear infinite}
.stage-hdr{background:linear-gradient(90deg,#16a34a1a,transparent);border-left:3px solid var(--green);padding:9px 15px;border-radius:0 7px 7px 0;margin-bottom:16px}
.lead{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.lead strong{color:var(--text)}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}

/* ── ALERTS ─────────────────────────────────────────── */
.alert{border-radius:7px;padding:9px 14px;font-size:11px;margin-bottom:14px;line-height:1.5}
.alert-gold{background:#f59e0b0d;border:1px solid #f59e0b2a;color:#fcd34d}
.alert-green{background:#16a34a0d;border:1px solid #16a34a2a;color:#86efac}
.alert-red{background:#dc26260d;border:1px solid #dc26262a;color:#fca5a5}

/* ── SETUP BANNER ───────────────────────────────────── */
.setup-banner{background:linear-gradient(135deg,#1c1200,#2a1800);border:1px solid #78350f55;border-radius:10px;padding:20px;margin-bottom:18px}
.setup-banner h2{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:var(--gold);margin-bottom:14px}
.setup-step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #2d1a0033}
.setup-step:last-child{border-bottom:none}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#000;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.step-body strong{color:#fcd34d;display:block;font-size:13px;margin-bottom:2px}
.step-body p{font-size:11px;color:#d4a017;line-height:1.6;margin-top:3px}
.code{background:#000;border:1px solid #333;border-radius:4px;padding:5px 10px;font-family:monospace;font-size:11px;color:#22c55e;display:block;margin-top:5px;word-break:break-all}

/* ── GRIDS ───────────────────────────────────────────── */
.grid-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.grid-ko{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.grid-venues{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.grid-standings{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:12px}

/* ── CARDS ───────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:9px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#2d5235}
.group-hdr{padding:11px 14px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .15s}
.group-hdr:hover{background:#0d1f10}
.group-letter{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:var(--green);line-height:1}
.expand-icon{color:var(--green);font-size:13px;transition:transform .2s}
.group-body{padding:8px 14px}
.team-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #0d1e0f}
.team-row:last-child{border-bottom:none}
.pos-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.pd1{background:#16a34a22;color:#4ade80}
.pd2{background:#1d4ed822;color:#60a5fa}
.pd3{background:#1a2e1c;color:var(--muted)}
.pd4{background:#1a2e1c;color:var(--dim)}
.tname{font-size:12px;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r32-pill{font-size:9px;padding:1px 5px;border-radius:8px;background:#16a34a1a;color:#4ade80;border:1px solid #16a34a33;font-weight:600;white-space:nowrap;flex-shrink:0;margin-left:auto}

/* ── MATCH LIST ─────────────────────────────────────── */
.matches-wrap{padding:0 14px 12px;border-top:1px solid var(--card-border);display:none}
.matches-wrap.open{display:block}
.mlabel{font-size:9px;color:var(--dim);font-weight:700;letter-spacing:.1em;padding:9px 0 5px;text-transform:uppercase}
.match-item{background:#071409;border-radius:5px;padding:7px 10px;margin-bottom:3px;transition:background .15s}
.match-item:hover{background:#0b1c0d}
.mrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mdate{color:var(--gold);font-weight:700;font-size:9px;min-width:34px;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em}
.mteams{font-size:12px;color:var(--text);flex:1;min-width:0}
.mvs{color:var(--dim);margin:0 3px}
.mvenue{font-size:9px;color:var(--dim);margin-top:2px}
.mtime{color:var(--muted)}

/* ── SCORE BADGES ───────────────────────────────────── */
.sbadge{display:inline-flex;align-items:center;gap:3px;border-radius:4px;padding:2px 7px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;flex-shrink:0;white-space:nowrap}
.sb-ft{background:#16a34a1a;color:#4ade80;border:1px solid #16a34a33}
.sb-live{background:#dc26261a;color:#f87171;border:1px solid #dc262633;animation:pulse 1.5s ease-in-out infinite}
.sb-ht{background:#7c3aed1a;color:#c4b5fd;border:1px solid #7c3aed33}
.sb-pen{background:#f59e0b1a;color:#fcd34d;border:1px solid #f59e0b33;animation:pulse 1.5s ease-in-out infinite}
.live-dot{width:5px;height:5px;border-radius:50%;background:#f87171;display:inline-block}

/* ── ODDS ────────────────────────────────────────────── */
.odds-box{margin-top:6px;background:#060f07;border-radius:5px;padding:6px 9px}
.olabel{font-size:9px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin-bottom:4px}
.orow{display:flex;gap:4px}
.ocol{flex:1;min-width:0;background:#0b1c0d;border:1px solid var(--card-border);border-radius:4px;padding:4px 5px;text-align:center}
.oname{font-size:9px;color:var(--muted);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oam{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;line-height:1}
.odec{font-size:9px;color:var(--muted)}
.opos{color:#4ade80}.oneg{color:#f87171}.odraw{color:#fcd34d}

/* ── KO CARDS ────────────────────────────────────────── */
.ko-card{background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:13px}
.ko-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ko-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.1em}
.ko-date{background:#f59e0b1a;color:var(--gold);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;font-family:'Barlow Condensed',sans-serif}
.ko-team{background:#071409;border-radius:4px;padding:7px 10px;font-size:12px;color:var(--text);margin-bottom:3px;display:flex;align-items:center;justify-content:space-between}
.ko-score{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:#4ade80}
.ko-vs{text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;color:var(--green);margin:3px 0;min-height:20px;display:flex;align-items:center;justify-content:center;gap:6px}
.ko-venue{font-size:10px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--card-border)}

/* ── TODAY BANNER ───────────────────────────────────── */
.today-wrap{background:linear-gradient(135deg,#0f2b18,#071a0c);border:1px solid #2d5235;border-radius:9px;padding:12px 14px;margin-bottom:16px}
.today-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:#4ade80;letter-spacing:.1em;margin-bottom:8px}
.today-item{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid #0d1e0f;flex-wrap:wrap}
.today-item:last-child{border-bottom:none}
.today-time{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--gold);min-width:56px;flex-shrink:0}
.today-teams{font-size:12px;color:var(--text);flex:1;min-width:100px}
.today-venue{font-size:10px;color:var(--dim)}

/* ── COUNTDOWN ───────────────────────────────────────── */
.countdown-wrap{background:linear-gradient(135deg,#0f2b18,#071a0c);border:1px solid #2d5235;border-radius:9px;padding:14px 16px;margin-bottom:16px;text-align:center}
.cd-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin-bottom:8px}
.cd-units{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.cd-unit{background:var(--card);border:1px solid var(--card-border);border-radius:7px;padding:8px 14px;min-width:58px}
.cd-num{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:var(--green);line-height:1}
.cd-sub{font-size:9px;color:var(--muted);letter-spacing:.08em;margin-top:2px;text-transform:uppercase}
.cd-started{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--green)}

/* ── FAVOURITE TEAM ─────────────────────────────────── */
.fav-bar{background:linear-gradient(135deg,#1a3020,#0e1c10);border:1px solid #2d5235;border-radius:9px;padding:12px 14px;margin-bottom:16px}
.fav-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.fav-teams{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.fav-btn{background:#0d2415;border:1px solid var(--card-border);border-radius:5px;padding:4px 9px;font-size:11px;color:var(--muted);transition:all .15s;cursor:pointer}
.fav-btn:hover,.fav-btn.active{background:#16a34a22;border-color:#16a34a44;color:#4ade80}
.fav-next{background:#071409;border-radius:6px;padding:9px 12px}
.fav-next-label{font-size:9px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin-bottom:4px}
.fav-next-match{font-size:13px;color:var(--text)}
.fav-next-meta{font-size:10px;color:var(--muted);margin-top:2px}

/* ── STANDINGS ───────────────────────────────────────── */
.std-card{background:var(--card);border:1px solid var(--card-border);border-radius:9px;overflow:hidden}
.std-grp-hdr{padding:10px 14px 4px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between}
.std-table{width:100%;border-collapse:collapse;font-size:11px}
.std-table th{color:var(--dim);font-weight:700;text-align:center;padding:4px 5px;border-bottom:1px solid var(--card-border);font-size:9px;letter-spacing:.06em}
.std-table th:nth-child(2){text-align:left}
.std-table td{padding:5px 5px;text-align:center;border-bottom:1px solid #0a180c;color:var(--muted)}
.std-table td:nth-child(2){text-align:left;color:var(--text);font-size:12px}
.std-table tr:last-child td{border-bottom:none}
.std-table tr.qs1 td{background:#16a34a07}
.std-table tr.qs2 td{background:#1d4ed807}
.std-table tr.qs3 td{background:#7c3aed07}
.std-pts{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.qual-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.qd-adv{background:#4ade80}.qd-3rd{background:#60a5fa}.qd-out{background:#3d6344}
.std-legend{display:flex;gap:10px;padding:6px 12px;border-top:1px solid var(--card-border);flex-wrap:wrap}
.std-leg{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted)}

/* ── STATS ───────────────────────────────────────────── */
.big-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px;margin-bottom:16px}
.bstat{background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:12px;text-align:center}
.bstat-num{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:900;color:var(--green);line-height:1}
.bstat-label{font-size:10px;color:var(--muted);margin-top:3px}
.stat-card{background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:14px}
.stat-card-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.08em;margin-bottom:10px}
.stat-row{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid #0a180c}
.stat-row:last-child{border-bottom:none}
.stat-rank{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;color:var(--dim);min-width:18px}
.rk-g{color:var(--gold)}.rk-s{color:#94a3b8}.rk-b{color:#c2773a}
.stat-name{font-size:12px;color:var(--text);flex:1}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#4ade80}
.stat-sub{font-size:9px;color:var(--dim)}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bar-label{font-size:11px;color:var(--text);min-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;background:#0b1c0d;border-radius:3px;height:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--green);transition:width .5s ease}
.bar-val{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;min-width:20px;text-align:right}

/* ── BRACKET ─────────────────────────────────────────── */
.bracket-note{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.bracket-round{margin-bottom:20px}
.bracket-round-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;color:var(--gold);letter-spacing:.08em;border-bottom:1px solid var(--card-border);padding-bottom:8px;margin-bottom:10px}
.bracket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.bracket-match{background:var(--card);border:1px solid var(--card-border);border-radius:7px;overflow:hidden}
.bm-hdr{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.08em;padding:4px 9px;border-bottom:1px solid var(--card-border);font-family:'Barlow Condensed',sans-serif;display:flex;justify-content:space-between}
.bm-team{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;border-bottom:1px solid #0a180c;font-size:12px;color:var(--text)}
.bm-team:last-child{border-bottom:none}
.bm-team.winner{background:#16a34a0d;color:#4ade80}
.bm-score{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:#4ade80}

/* ── CALENDAR ────────────────────────────────────────── */
.cal-hero{background:linear-gradient(135deg,#0f2b18,#071a0c);border:1px solid #2d5235;border-radius:10px;padding:18px 20px;margin-bottom:18px}
.cal-hero-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:#fff;margin-bottom:4px}
.cal-hero-sub{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.cal-buttons{display:flex;flex-wrap:wrap;gap:8px}
.cal-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;text-decoration:none}
.cal-btn-apple{background:#1c3a24;color:#4ade80;border:1px solid #2d5235}
.cal-btn-apple:hover{background:#234a2d;transform:translateY(-1px)}
.cal-btn-google{background:#1a2a3e;color:#60a5fa;border:1px solid #1e3a5f}
.cal-btn-google:hover{background:#1e3350;transform:translateY(-1px)}
.cal-btn-outlook{background:#1a1f3a;color:#a5b4fc;border:1px solid #2d3580}
.cal-btn-outlook:hover{background:#1e2548;transform:translateY(-1px)}
.cal-btn-ics{background:#2a1a00;color:#fcd34d;border:1px solid #78350f55}
.cal-btn-ics:hover{background:#331f00;transform:translateY(-1px)}
.cal-filter-wrap{background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:14px;margin-bottom:14px}
.cal-filter-title{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.1em;margin-bottom:9px}
.cal-filter-btns{display:flex;flex-wrap:wrap;gap:5px}
.cal-f-btn{background:#071409;border:1px solid var(--card-border);border-radius:5px;padding:4px 9px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s}
.cal-f-btn:hover,.cal-f-btn.on{background:#16a34a1a;border-color:#16a34a44;color:#4ade80}
.cal-event-list{display:flex;flex-direction:column;gap:6px}
.cal-event{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:12px;transition:border-color .15s}
.cal-event:hover{border-color:#2d5235}
.cal-event-date{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--gold);font-size:11px;min-width:38px;flex-shrink:0;line-height:1.3}
.cal-event-day{font-size:9px;color:var(--dim);font-weight:600;letter-spacing:.05em}
.cal-event-teams{font-size:13px;color:var(--text);flex:1;min-width:0}
.cal-event-meta{font-size:10px;color:var(--dim);margin-top:2px}
.cal-event-time{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;flex-shrink:0}

.venue-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:var(--text);margin-bottom:2px}

.vstat{background:#071409;border-radius:5px;padding:7px 9px}
.vstat-label{font-size:8px;color:var(--dim);letter-spacing:.07em;font-weight:700;text-transform:uppercase}
.vstat-val{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--text);margin-top:1px}

.kround:last-child{padding-right:0}

.kround:not(:first-child) .kcell::before{content:"";position:absolute;left:-18px;top:25%;width:2px;height:50%;background:#3a6b45}

.kpct.dim{color:var(--dim);font-weight:600}
.ktrack{height:3px;background:#122415;border-radius:2px;margin-top:6px;overflow:hidden}
.kfill{height:100%;border-radius:2px;transition:width .5s}

const a2d=n=>n>0?((n/100)+1).toFixed(2):((100/Math.abs(n))+1).toFixed(2);
const fmtAm=n=>n>0?'+'+n:''+n;
const oc=n=>n>=0?'opos':'oneg';

function norm(n){
  if(!n) return '';
  if(typeof n!=='string') return '';
  const M={'Czech Republic':'Czechia','Czechia':'Czechia',
    'Bosnia-Herzegovina':'Bosnia and Herzegovina','Bosnia & Herzegovina':'Bosnia and Herzegovina',
    "Ivory Coast":"Côte d'Ivoire",'Cape Verde':'Cabo Verde','Curacao':'Curaçao',
    'Curaçao':'Curaçao','Turkey':'Türkiye','Congo DR':'DR Congo','Democratic Republic of the Congo':'DR Congo','Korea Republic':'South Korea',
    'United States':'USA'};
  return M[n]||n;
}
function sk(a,b){return norm(a)+'__'+norm(b);}
function getScore(h,a){return scoresMap[sk(h,a)]||scoresMap[sk(a,h)]||null;}

function cleanVal(v){
  if(v==null) return null;
  const s=String(v).trim();
  if(!s||s.toLowerCase()==='null') return null;
  return v;
}
function apiName(v){
  if(cleanVal(v)==null) return '';
  if(typeof v==='string') return norm(v);
  if(typeof v!=='object') return '';
  const keys=['name_en','team_name_en','home_team_name_en','away_team_name_en',
    'name','team_name','full_name','short_name','label','home_team_label','away_team_label'];
  for(const k of keys){
    const n=apiName(v[k]);
    if(n) return n;
  }
  return apiName(v.team)||apiName(v.country)||apiName(v.nation);
}
function apiId(v){
  if(cleanVal(v)==null) return '';
  if(typeof v==='string'||typeof v==='number') return String(v);
  if(typeof v!=='object') return '';
  return cleanVal(v.team_id)||cleanVal(v.teamId)||cleanVal(v.id)||cleanVal(v._id)||apiId(v.team);
}
function teamFromId(id){
  const key=String(cleanVal(id)||'');
  return key?(teamById[key]||STATIC_TEAM_BY_ID[key]||''):'';
}
function rowName(row){
  const n=apiName(row?.team)||apiName(row?.country)||apiName(row?.name)||apiName(row?.team_name)||apiName(row);
  const id=apiId(row?.team)||apiId(row);
  return norm(n||teamFromId(id));
}
// Pull the numeric stats off a live standings row (tolerant of field-name variants).
function rowStats(row){
  const r=row||{};
  const w=Number(r.wins??r.won??r.w??0)||0;
  const d=Number(r.draws??r.drawn??r.d??0)||0;
  const l=Number(r.losses??r.lost??r.l??0)||0;
  const gf=Number(r.goals_for??r.gf??0)||0;
  const ga=Number(r.goals_against??r.ga??0)||0;
  const gd=r.goal_difference??r.gd;
  const p=r.played??r.mp;
  return {pts:Number(r.points??r.pts??0)||0,w,d,l,gf,ga,
    gd:gd!=null?Number(gd):gf-ga,
    p:p!=null?Number(p):w+d+l};
}
// Always render the group's 4 known teams; match each to its live row by
// resolved name or id so a name can never come out blank, and rank by points.
function groupStandings(g){
  const live=standingsMap[g.id]||[];
  const has=live.length>0;
  const rows=g.teams.map(team=>{
    const row=has?live.find(r=>{
      const n=rowName(r);
      if(n&&n===team) return true;
      const id=apiId(r?.team)||apiId(r);
      return !!id&&teamFromId(id)===team;
    }):null;
    return {team,hasRow:!!row,...rowStats(row)};
  });
  if(has) rows.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  return {has,rows};
}
// A group is "decided" once all six of its matches have a final score.
function groupComplete(g){
  return g.matches.every(m=>{
    const sc=getScore(m.home,m.away);
    return sc&&['ft','finished','completed'].includes(String(sc.status||'').toLowerCase());
  });
}
// Resolve a knockout slot label like "Group A 1st" / "Group B 2nd" to the
// actual team from live standings. Returns {team, provisional} when known,
// or {label} to keep the original placeholder (e.g. "Best 3rd (…)", "R32 W1").
// provisional=true means the group is still in progress, so the position
// reflects the CURRENT table and may still change.
function resolveSlot(label){
  if(typeof label!=='string') return {label};
  const m=label.match(/^Group\s+([A-L])\s+(1st|2nd|3rd)$/i);
  if(!m) return {label};
  const letter=m[1].toUpperCase();
  const idx={'1st':0,'2nd':1,'3rd':2}[m[2].toLowerCase()];
  const g=GROUPS.find(x=>x.id===letter);
  if(!g||!standingsMap[letter]||!standingsMap[letter].length) return {label};
  const {rows}=groupStandings(g);
  const row=rows[idx];
  if(!row||!row.team) return {label};
  return {team:row.team, provisional:!groupComplete(g)};
}
// Render a resolved slot: team (with a • dot while provisional) or a muted placeholder.
function slotDisplay(r,fallback){
  if(r&&r.team) return `${fl(r.team)}${r.provisional?' <span title="Provisional — group still in progress" style="color:var(--gold);font-weight:700">•</span>':''}`;
  return `<span style="color:var(--dim)">${fallback}</span>`;
}
function teamNameFromGame(m,side){
  const pre=side+'_team';
  const n=apiName(m[pre+'_name_en'])||apiName(m[pre+'_name'])||apiName(m[pre])||
    apiName(m[side+'Team'])||apiName(m[side])||apiName(m[pre+'_label']);
  const id=m[pre+'_id']??m[side+'TeamId']??m[side+'_id'];
  return norm(n||teamFromId(id));
}
function gameStatus(m){
  const raw=String(cleanVal(m.status)??cleanVal(m.time_elapsed)??'').toLowerCase();
  const done=String(m.finished||'').toLowerCase()==='true'||['ft','finished','completed'].includes(raw);
  if(done) return {status:'finished',started:true,live:false,minute:null};
  if(!raw||['false','notstarted','not_started','scheduled','pre','tbd'].includes(raw)){
    return {status:'scheduled',started:false,live:false,minute:null};
  }
  const minute=/^\d+$/.test(raw)?Number(raw):null;
  return {status:raw==='halftime'?'ht':'live',started:true,live:true,minute};
}
function scoreVal(v){
  const c=cleanVal(v);
  return c==null?null:c;
}

// All kickoff times are stored in UTC and displayed in US Pacific time

const DISPLAY_TZ='America/Los_Angeles';
function fmtTime(iso){
  if(!iso) return null;
  try{return new Date(iso).toLocaleTimeString('en-US',{timeZone:DISPLAY_TZ,hour:'numeric',minute:'2-digit',timeZoneName:'short'});}catch{return null;}
}

function sbadge(sc){
  if(!sc) return '';
  const {status:st,home_score:hs,away_score:as,minute:mn}=sc;
  const s=(st||'').toLowerCase();
  const score=`${hs??'–'}–${as??'–'}`;
  if(['ft','finished','completed'].includes(s)) return `<span class="sbadge sb-ft">✓ FT ${score}</span>`;
  if(['ht','halftime'].includes(s)) return `<span class="sbadge sb-ht">HT ${score}</span>`;
  if(['pen','penalties'].includes(s)) return `<span class="sbadge sb-pen">PENS ${score}</span>`;
  if(['live','in_play','1h','2h','et'].includes(s)){
    const m=mn?` ${mn}'`:'';
    return `<span class="sbadge sb-live"><span class="live-dot"></span> ${score}${m}</span>`;
  }
  return '';
}

// ── FETCH ──────────────────────────────────────────────
// Cache-buster: append a unique timestamp + send no-store so every
// Refresh actually hits the network instead of a cached GET response.
// NOTE: no custom request headers here — adding e.g. Cache-Control would turn
// these into non-simple CORS requests and trigger a preflight the free API may
// not answer. cache:'no-store' + the _t query param defeat caching safely.
const bust=u=>u+(u.includes('?')?'&':'?')+'_t='+Date.now();
const noCache={cache:'no-store'};

// Red cards are pulled defensively from the live games feed if it exposes
// card/booking events (the openfootball dataset has no card data). Keyed by
// player+team → {name, team, count}. Stays empty if the feed omits cards.
let redCards={};
function collectRedCards(m,h,a){
  [m.events,m.incidents,m.timeline,m.cards,m.bookings].filter(Array.isArray).forEach(arr=>arr.forEach(ev=>{
    if(!ev||typeof ev!=='object') return;
    const type=String(ev.type??ev.card??ev.card_type??ev.cardType??ev.detail??ev.kind??ev.color??'').toLowerCase();
    if(!(/red/.test(type)||ev.red===true||ev.red_card===true||ev.redCard===true)) return;
    const name=apiName(ev.player)||apiName(ev.player_name)||apiName(ev.name)||apiName(ev);
    if(!name) return;
    const side=String(ev.team??ev.side??ev.team_side??'').toLowerCase();
    const team=side==='home'||side==='1'?h:side==='away'||side==='2'?a:norm(apiName(ev.team)||'');
    const key=name+'|'+team;
    (redCards[key]||(redCards[key]={name,team,count:0})).count++;
  }));
}

async function fetchGames(){
  const r=await fetch(bust(FREE_API+'/get/games'),noCache);
  if(!r.ok) throw new Error('games '+r.status);
  const data=await r.json();
  rawGames=Array.isArray(data)?data:(data.data||data.matches||data.games||[]);
  scoresMap={}; hasLive=false; redCards={};
  rawGames.forEach(m=>{
    const h=teamNameFromGame(m,'home')||norm(m.team1||m.home||'');
    const a=teamNameFromGame(m,'away')||norm(m.team2||m.away||'');
    if(!h||!a) return;
    collectRedCards(m,h,a);
    const st=gameStatus(m);
    if(st.live) hasLive=true;
    const entry={
      status:st.status,
      home_score:st.started?scoreVal(m.home_score??m.score_home??m.homeScore??m.score1):null,
      away_score:st.started?scoreVal(m.away_score??m.score_away??m.awayScore??m.score2):null,
      minute:st.minute||m.minute||m.elapsed||null
    };
    scoresMap[sk(h,a)]=entry; scoresMap[sk(a,h)]=entry;
  });
  const p=document.getElementById('scores-pill');
  if(p){p.style.display='';p.className=hasLive?'pill pill-live':'pill pill-ok';p.textContent=hasLive?'🔴 LIVE':'📡 Scores';}
}

  const next={};

async function fetchGroups(){
  const r=await fetch(bust(FREE_API+'/get/groups'),noCache);
  if(!r.ok) throw new Error('groups '+r.status);
  const data=await r.json();
  standingsMap={};
  const arr=Array.isArray(data)?data:(data.data||data.groups||data.standings||[]);
  arr.forEach(entry=>{
    const grp=(entry.group_name||entry.group||entry.name||'').replace(/^Group\s*/i,'').trim().toUpperCase();
    if(!grp) return;
    if(!standingsMap[grp]) standingsMap[grp]=[];
    const teams=entry.teams||entry.standings||null;
    if(teams) teams.forEach(t=>standingsMap[grp].push(t));

  });

async function fetchOdds(){
  // Client-side cache: don't refetch odds more than once per ODDS_TTL.
  // This also means the 60s live-score loop never re-hits the odds proxy.
  if(oddsAt && Date.now()-oddsAt < ODDS_TTL && Object.keys(oddsMap).length) return;
  let r;
  try{ r=await fetch(ODDS_ENDPOINT); }catch{ oddsStatus='unavailable'; return; }   // let the edge cache serve it
  if(!r.ok){ oddsStatus='unavailable'; return; }
  oddsStatus=r.headers.get('X-Odds-Status')||'ok';
  const data=await r.json().catch(()=>null);
  if(!Array.isArray(data)) return;
  const next={};
  data.forEach(e=>{
    const {home_team:ht,away_team:at,bookmakers:bks}=e;
    if(!bks||!bks.length) return;
    const bk=bks[0],h2h=bk.markets.find(m=>m.key==='h2h');
    if(!h2h) return;
    const out={};h2h.outcomes.forEach(o=>{out[o.name]=o.price;});
    const entry={homeTeam:ht,awayTeam:at,home:out[ht],away:out[at],draw:out['Draw'],bookmaker:bk.title};
    next[ht+'_'+at]=entry; next[at+'_'+ht]=entry;
  });
  oddsMap=next;
  oddsAt=Date.now();
  const p=document.getElementById('odds-pill');
  if(p){
    if(oddsStatus==='unavailable'){p.style.display='';p.className='pill pill-warn';p.textContent='📊 Odds unavailable';}
    else if(Object.keys(oddsMap).length){p.style.display='';p.className='pill pill-ok';p.textContent='📊 Odds Live';}
  }
}

async function refreshAll(){
  if(loadingData) return;
  loadingData=true;
  if(liveRefreshTimer){clearTimeout(liveRefreshTimer);liveRefreshTimer=null;}
  const btn=document.getElementById('refresh-btn');
  if(btn){btn.disabled=true;btn.textContent='⟳ …';}
  try{
    const jobs=[
      ['Teams',fetchTeams()],
      ['Scores',fetchGames()],
      ['Standings',fetchGroups()],
      ['Players',fetchWcData()]
    ];
    if(hasOdds()) jobs.push(['Odds',fetchOdds()]);
    const results=await Promise.allSettled(jobs.map(j=>j[1]));
    const failed=results.map((r,i)=>r.status==='rejected'?jobs[i][0]:null).filter(Boolean);
    const t=new Date().toLocaleTimeString();
    const lu=document.getElementById('last-upd');
    const msg=failed.length?`Updated ${t} · ${failed.join(', ')} failed`:'Updated '+t;
    if(lu){lu.textContent=msg;lu.style.display='';lu.style.color=failed.length?'var(--gold)':'';}
    document.getElementById('footer-upd').textContent=failed.length?`Last refresh had issues at ${t}`:'Last updated '+t;
    render(currentTab);
    if(hasLive) liveRefreshTimer=setTimeout(refreshAll,60000);
  }finally{
    loadingData=false;
    if(btn){btn.disabled=false;btn.textContent='⟳ Refresh';}
  }
}

// ── COUNTDOWN ──────────────────────────────────────────
function countdown(){
  const start=new Date('2026-06-11T20:00:00Z');
  const end=new Date('2026-07-19T19:00:00Z');
  const now=new Date();
  if(now>=end) return `<div class="countdown-wrap"><div class="cd-label">TOURNAMENT COMPLETE</div><div class="cd-started">🏆 World Cup 2026 has ended</div></div>`;
  if(now>=start) return `<div class="countdown-wrap"><div class="cd-label">TOURNAMENT UNDERWAY</div><div class="cd-started">⚽ World Cup 2026 is LIVE!</div></div>`;
  const diff=start-now;
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  return `<div class="countdown-wrap">
    <div class="cd-label">⏳ TOURNAMENT KICKS OFF IN</div>
    <div class="cd-units">
      <div class="cd-unit"><div class="cd-num" id="cd-d">${d}</div><div class="cd-sub">DAYS</div></div>

      <div class="cd-unit"><div class="cd-num" id="cd-m">${String(m).padStart(2,'0')}</div><div class="cd-sub">MIN</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-s">${String(s).padStart(2,'0')}</div><div class="cd-sub">SEC</div></div>
    </div>
  </div>`;
}

// ── PACIFIC-DATE HELPERS ───────────────────────────────
// All "today"/"this week" logic uses the Pacific calendar day so it matches
// the displayed kickoff times regardless of the visitor's own timezone.
function pacDate(d){ // 'YYYY-MM-DD' in Pacific
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:DISPLAY_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const o={};p.forEach(x=>o[x.type]=x.value);
  return `${o.year}-${o.month}-${o.day}`;
}
function pacWeekday(d){ // 0=Sun .. 6=Sat, in Pacific
  const wd=new Intl.DateTimeFormat('en-US',{timeZone:DISPLAY_TZ,weekday:'short'}).format(d);
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(wd);
}
function pacDayLabel(d){ // e.g. 'Thu'
  return new Intl.DateTimeFormat('en-US',{timeZone:DISPLAY_TZ,weekday:'short'}).format(d);
}

// ── THIS WEEK BANNER ───────────────────────────────────
// Every match already kicked off this week (Mon → now, Pacific), with scores.
function weekBanner(){
  const now=new Date();
  const daysSinceMon=(pacWeekday(now)+6)%7;        // Mon=0 … Sun=6
  const weekDays=new Set();
  for(let i=daysSinceMon;i>=0;i--) weekDays.add(pacDate(new Date(now.getTime()-i*86400000)));
  const played=[];
  GROUPS.forEach(g=>g.matches.forEach(m=>{
    if(!m.kickoff) return;
    const k=new Date(m.kickoff);
    if(k<=now && weekDays.has(pacDate(k))) played.push({...m,group:g.id});
  }));
  if(!played.length) return '';
  played.sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));
  let goals=0,withScore=0;
  played.forEach(m=>{const sc=getScore(m.home,m.away);if(sc&&sc.home_score!=null&&sc.away_score!=null){goals+=Number(sc.home_score)+Number(sc.away_score);withScore++;}});
  const summary=`${played.length} match${played.length!==1?'es':''}${withScore?` · ${goals} goal${goals!==1?'s':''}`:''}`;
  let h=`<div class="today-wrap"><div class="today-title">📆 THIS WEEK'S MATCHES <span style="color:var(--muted);font-weight:400;letter-spacing:.02em">· ${summary}</span></div>`;
  played.forEach(m=>{
    const sc=getScore(m.home,m.away);
    const badge=sbadge(sc);
    const kt=fmtTime(m.kickoff);
    h+=`<div class="today-item">
      <span class="today-time">${pacDayLabel(new Date(m.kickoff))}${kt?' '+kt:''}</span>
      <span class="today-teams">${fl(m.home)} <span style="color:var(--dim)">vs</span> ${fl(m.away)}</span>
      ${badge||''}
      <span class="today-venue">Grp ${m.group} · ${m.city}</span>
    </div>`;
  });
  return h+'</div>';
}

// ── RENDER: BRACKET ────────────────────────────────────
// Implied win % for a resolved matchup, from live odds (American → probability,
// de-vigged to a 2-way split). Returns {teamName:pct,...} or null if no odds.
function winProb(a,b){
  if(!a||!b) return null;
  const o=oddsMap[a+'_'+b]||oddsMap[b+'_'+a];
  if(!o||o.home==null||o.away==null) return null;
  const imp=n=>n>0?100/(n+100):(-n)/((-n)+100);
  const ph=imp(o.home), pa=imp(o.away), s=ph+pa;
  if(!s) return null;
  const map={};
  map[norm(o.homeTeam)]=ph/s; map[norm(o.awayTeam)]=pa/s;
  const wa=map[a], wb=map[b];
  if(wa==null||wb==null) return null;
  return {[a]:Math.round(wa*100),[b]:Math.round(wb*100)};
}
function kTeamRow(r,other,sc,side){
  const name=r.team||null, isTBD=!name;
  const prob=(name&&other.team)?winProb(name,other.team):null;
  const pct=prob?prob[name]:null, oPct=prob?prob[other.team]:null;
  const fav=pct!=null&&oPct!=null&&pct>=oPct;
  const myScore=sc?(side==='home'?sc.home_score:sc.away_score):null;
  const oScore=sc?(side==='home'?sc.away_score:sc.home_score):null;
  let win=false;
  if(myScore!=null&&oScore!=null){
    if(Number(myScore)>Number(oScore)) win=true;
    else if(Number(myScore)===Number(oScore)&&sc&&sc.pens){
      win=Number(side==='home'?sc.pens[0]:sc.pens[1])>Number(side==='home'?sc.pens[1]:sc.pens[0]);
    }
  }
  const fill=fav?'var(--green)':'#7f1d1d';
  return `<div class="kteam${win?' kwin':''}">
    <div class="kteam-top">
      <span class="kflag">${name?(FLAGS[name]||''):''}</span>
      <span class="kname${isTBD?' tbd':''}">${name||r.label}${name&&r.provisional?' <span style="color:var(--gold)">•</span>':''}</span>
      ${myScore!=null?`<span class="kscore">${myScore}</span>`:(pct!=null?`<span class="kpct${fav?'':' dim'}">${pct}%</span>`:'')}
    </div>
    ${pct!=null?`<div class="ktrack"><div class="kfill" style="width:${pct}%;background:${fill}"></div></div>`:''}
  </div>`;
}

function koCityTok(s){s=(s||'').toLowerCase();
  if(s.includes('inglewood')||s.includes('los angeles'))return'LA';

function ofToUTC(date,time){
  const mm=String(time||'').match(/UTC([+-])(\d+)/); if(!mm||!date) return null;
  const off=(mm[1]==='-'?-1:1)*Number(mm[2]);
  const [hh,mi]=time.split(' ')[0].split(':').map(Number);
  const [Y,Mo,D]=date.split('-').map(Number);
  return new Date(Date.UTC(Y,Mo-1,D,hh,mi)-off*3600000).toISOString();
}
const KO_LV={'Round of 32':1,'Round of 16':2,'Quarter-final':3,'Semi-final':4,'Final':5,'Match for third place':0};
let wcOrder={}; // {r32:[num,...] in true bracket order, r16:[...], ...}
function indexKO(matches){
  wcKO={}; wcOrder={};
  const rmap={'Round of 32':'r32','Round of 16':'r16','Quarter-final':'qf','Semi-final':'sf','Match for third place':'third','Final':'final'};
  matches.forEach(m=>{
    const rk=rmap[m.round]; if(!rk) return;
    const iso=ofToUTC(m.date,m.time); if(!iso) return;
    let pd; try{ pd=pacDate(new Date(iso)); }catch{ return; }
    wcKO[`${rk}|${koCityTok(m.ground)}|${pd}`]={num:m.num,raw1:m.team1,raw2:m.team2,score:m.score||null};
  });
  buildKoOrder(matches);
}
// Reconstruct the true bracket order (which matches feed which) from the
// openfootball match numbers + W##/L## feeder refs, so the connector tree can
// place each match directly between its two real feeders.
function buildKoOrder(matches){
  const ko=matches.filter(m=>KO_LV[m.round]!=null&&m.num!=null);
  if(!ko.length) return;
  const byNum={}; ko.forEach(m=>byNum[m.num]=m);
  const winnerOf=m=>{const b=m.score&&(m.score.ft||m.score.et);if(!b)return null;let s;if(b[0]!==b[1])s=b[0]>b[1]?1:2;else if(m.score&&m.score.p)s=m.score.p[0]>m.score.p[1]?1:2;else return null;return norm(s===1?m.team1:m.team2);};
  const winIdx={}; ko.forEach(m=>{const lv=KO_LV[m.round];const w=winnerOf(m);if(w)(winIdx[lv]=winIdx[lv]||{})[w]=m.num;});
  const pnum=(ref,childLv)=>{const w=String(ref).match(/^W(\d+)$/);if(w)return +w[1];const l=String(ref).match(/^L(\d+)$/);if(l)return +l[1];return (winIdx[childLv-1]||{})[norm(ref)]??null;};
  const parents=m=>{const lv=KO_LV[m.round];return [pnum(m.team1,lv),pnum(m.team2,lv)];};
  const ord={1:[],2:[],3:[],4:[]};
  const fin=ko.find(m=>m.round==='Final'); if(!fin) return;
  (function dfs(m){const lv=KO_LV[m.round];if(lv<=1){if(lv===1)ord[1].push(m.num);return;}parents(m).forEach(p=>{if(p&&byNum[p])dfs(byNum[p]);});if(ord[lv])ord[lv].push(m.num);})(fin);
  if(ord[1].length===16) wcOrder={r32:ord[1],r16:ord[2],qf:ord[3],sf:ord[4]};
}
// Resolve a bracket slot to its real teams + score, preferring live openfootball
// data and falling back to group-standings resolution before the draw is set.
function koResolve(roundKey,slot){
  const isReal=n=>!!n&&(FLAGS[norm(n)]!=null||/[a-z]/.test(n));
  let of=null;
  try{ of=wcKO[`${roundKey}|${koCityTok(slot.city)}|${pacDate(new Date(slot.kickoff))}`]; }catch{}
  // Resolve each side independently: real team → use it; W##/L## → "Winner/Loser
  // of Match ##"; otherwise fall back to group-standings/placeholder resolution.
  const side=(raw,ph)=>{
    if(of&&isReal(raw)) return {team:norm(raw),label:norm(raw),provisional:false};
    const w=of?String(raw||'').match(/^([WL])(\d+)$/):null;
    if(w) return {team:null,label:`${w[1]==='W'?'Winner':'Loser'} M${w[2]}`};
    return resolveSlot(ph);
  };
  const home=side(of&&of.raw1,slot.home), away=side(of&&of.raw2,slot.away);
  let sc;
  if(of&&isReal(of.raw1)&&isReal(of.raw2)){
    const base=of.score&&(of.score.ft||of.score.et);
    sc=base?{home_score:base[0],away_score:base[1],status:'finished',pens:of.score.p||null}:getScore(home.team,away.team);
  } else {
    sc=getScore(home.team||slot.home,away.team||slot.away);
  }
  return {home,away,sc,num:of?of.num:null};
}
function computePlayerStats(matches){
  const played=matches.filter(m=>m&&m.score&&Array.isArray(m.score.ft));
  const tally={}, hats=[];
  played.forEach(m=>{
    [['goals1',m.team1],['goals2',m.team2]].forEach(([k,team])=>{
      const per={};
      (m[k]||[]).forEach(g=>{
        if(!g||g.owngoal||!g.name) return;   // own goals don't count toward scorers
        const t=tally[g.name]||(tally[g.name]={name:g.name,team:norm(team),goals:0,pens:0});
        t.goals++; if(g.penalty) t.pens++;
        per[g.name]=(per[g.name]||0)+1;
      });
      Object.entries(per).forEach(([name,n])=>{ if(n>=3) hats.push({name,team:norm(team),goals:n,match:`${norm(m.team1)} v ${norm(m.team2)}`,date:m.date}); });
    });
  });
  const scorers=Object.values(tally).sort((a,b)=>b.goals-a.goals||a.pens-b.pens||a.name.localeCompare(b.name));
  let high=null,big=null,maxTeamMatch=0; const teamGoals={};
  played.forEach(m=>{
    const a=m.score.ft[0]??0,b=m.score.ft[1]??0,tot=a+b,marg=Math.abs(a-b);
    const label=`${norm(m.team1)} ${a}–${b} ${norm(m.team2)}`;
    if(!high||tot>high.tot) high={tot,label};
    if(!big||marg>big.marg) big={marg,label};
    maxTeamMatch=Math.max(maxTeamMatch,a,b);
    teamGoals[norm(m.team1)]=(teamGoals[norm(m.team1)]||0)+a;
    teamGoals[norm(m.team2)]=(teamGoals[norm(m.team2)]||0)+b;
  });
  const tt=Object.entries(teamGoals).sort((x,y)=>y[1]-x[1])[0];
  const topTeam=tt?{team:tt[0],goals:tt[1]}:null;
  const records=[];
  if(scorers.length&&scorers[0].goals>WC_RECORDS.goldenBoot.n) records.push(`${scorers[0].name} passed the single-tournament goals record (${scorers[0].goals} vs ${WC_RECORDS.goldenBoot.n}, ${WC_RECORDS.goldenBoot.who} ${WC_RECORDS.goldenBoot.year})`);
  if(maxTeamMatch>WC_RECORDS.teamMatchGoals.n) records.push(`A team scored ${maxTeamMatch} in one match — past the all-time ${WC_RECORDS.teamMatchGoals.n}`);
  if(big&&big.marg>WC_RECORDS.margin.n) records.push(`Win margin of ${big.marg} — past the all-time ${WC_RECORDS.margin.n}`);
  return {played:played.length,scorers,hats,high,big,topTeam,maxTeamMatch,records};
}

function computeStats(){
  const ts={};
  const initT=n=>{if(!ts[n])ts[n]={name:n,gf:0,ga:0,w:0,d:0,l:0,played:0,cs:0};};
  let totalGoals=0,played=0,goalsList=[];
  GROUPS.forEach(g=>g.matches.forEach(m=>{
    initT(m.home);initT(m.away);
    const sc=getScore(m.home,m.away);
    if(!sc||sc.home_score==null||sc.away_score==null) return;
    const hg=Number(sc.home_score),ag=Number(sc.away_score);
    if(isNaN(hg)||isNaN(ag)) return;
    const s=(sc.status||'').toLowerCase();
    if(!['ft','finished','completed'].includes(s)) return;
    played++; totalGoals+=hg+ag; goalsList.push(hg+ag);
    ts[m.home].gf+=hg;ts[m.home].ga+=ag;ts[m.home].played++;
    ts[m.away].gf+=ag;ts[m.away].ga+=hg;ts[m.away].played++;
    if(hg>ag){ts[m.home].w++;ts[m.away].l++;}
    else if(ag>hg){ts[m.away].w++;ts[m.home].l++;}
    else{ts[m.home].d++;ts[m.away].d++;}
    if(ag===0) ts[m.home].cs++;
    if(hg===0) ts[m.away].cs++;
  }));
  const gpg=played?Math.round((totalGoals/played)*100)/100:null;
  const high=goalsList.length?Math.max(...goalsList):null;
  const arr=Object.values(ts).filter(t=>t.played>0);
  return{gpg,high,totalGoals,played,
    topScoring:[...arr].sort((a,b)=>b.gf-a.gf).slice(0,8),
    topWins:[...arr].sort((a,b)=>b.w-a.w||b.gf-a.gf).slice(0,8),
    bestDef:[...arr].sort((a,b)=>a.ga-b.ga||b.cs-a.cs).slice(0,8),
    cleanSheets:[...arr].filter(t=>t.cs>0).sort((a,b)=>b.cs-a.cs).slice(0,8),
    totalGroupMatches:GROUPS.reduce((s,g)=>s+g.matches.length,0)
  };
}

  const ft=(t,pos)=>{const n=t.team;return `<div class="final-team"><div class="final-flag">${n?(FLAGS[n]||'🏳️'):'🏳️'}</div><div class="final-name">${n||'TBD'}${f.sc&&(f.sc.home_score!=null)?` <span style="color:#4ade80">${pos==='SF Winner 1'?f.sc.home_score:f.sc.away_score}</span>`:''}</div><div class="final-pos">${pos}</div></div>`;};
  h+=`<div class="final-card"><div class="final-sub">FIFA WORLD CUP 2026 FINAL</div>
  <div class="final-teams">
    ${ft(f.home,'SF Winner 1')}
    <div class="final-vs">VS</div>
    ${ft(f.away,'SF Winner 2')}
  </div>
  <div class="final-meta">
    <div style="font-size:18px;margin-bottom:3px">🏟️</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:#fff">MetLife Stadium</div>
    <div style="font-size:11px;color:var(--muted);margin-top:1px">East Rutherford, New Jersey</div>
    <div class="final-time">SUNDAY JULY 19 · 12:00 PM PT</div>
  </div></div>`;
  h+=`<div class="contenders-card"><div class="section-title">📊 FAVORITES TO LIFT THE TROPHY</div>`;
  CONTENDERS.forEach(c=>h+=`<div class="crow"><span class="cflag">${c.flag}</span><div class="cinfo"><div class="cname">${c.name}</div><div class="cnote">${c.note}</div></div><div class="codds"><div class="cam">+${c.am}</div><div class="cdec">${a2d(c.am)}</div></div></div>`);
  h+=`</div><div style="background:var(--card);border:1px solid var(--card-border);border-radius:7px;padding:10px 14px;max-width:480px;margin:0 auto;font-size:12px;color:var(--muted)"><strong style="color:var(--gold)">🥉 3rd Place Match</strong> · Sat Jul 18 · 2:00 PM PT · Hard Rock Stadium · Miami, FL</div>`;
  return h;
}

function stageHdr(title,sub,color){
  const c=color==='gold'?'var(--gold)':'var(--green)';
  const bc=color==='gold'?'#f59e0b':'var(--green)';
  return `<div class="stage-hdr" style="border-left-color:${bc};margin-bottom:16px"><span class="hf" style="font-size:19px;font-weight:800;color:${c}">${title}</span><span style="font-size:12px;color:var(--muted);margin-left:10px">${sub}</span></div>`;
}

// ── CALENDAR / ICS ─────────────────────────────────────

// State: which filters are active
let calFilter={group:true,r32:true,r16:true,qf:true,sf:true,final:true,favOnly:false};

// Format a Date as ICS timestamp: 20260611T200000Z
function icsDate(iso){
  if(!iso) return null;
  const d=new Date(iso);
  const pad=n=>String(n).padStart(2,'0');
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+
    'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
}

// Sanitize text for ICS (escape commas, semicolons, newlines)
function icsText(s){
  return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

// Build a single VEVENT block
function makeVEvent(home,away,startIso,venue,city,durationMins=105){
  const start=icsDate(startIso);
  if(!start) return '';
  const end=icsDate(new Date(new Date(startIso).getTime()+durationMins*60000).toISOString());
  const uid=`wc2026-${home.replace(/\s+/g,'')}-${away.replace(/\s+/g,'')}-${start}@wc2026tracker`;
  const summary=icsText(`⚽ ${home} vs ${away}`);
  const location=icsText(`${venue}, ${city}`);
  const desc=icsText(`FIFA World Cup 2026 Group Stage Match\n${home} vs ${away}\n${venue}, ${city}`);
  return `BEGIN:VEVENT\r\nUID:${uid}\r\nDTSTAMP:${icsDate(new Date().toISOString())}\r\nDTSTART:${start}\r\nDTEND:${end}\r\nSUMMARY:${summary}\r\nLOCATION:${location}\r\nDESCRIPTION:${desc}\r\nSTATUS:CONFIRMED\r\nEND:VEVENT\r\n`;
}

// Collect all matches that pass the current filter
function getFilteredMatches(){
  const events=[];
  if(calFilter.group){
    GROUPS.forEach(g=>g.matches.forEach(m=>{
      if(!m.kickoff) return;
      if(calFilter.favOnly && m.home!==favTeam && m.away!==favTeam) return;
      events.push({home:m.home,away:m.away,start:m.kickoff,venue:m.venue,city:m.city,type:'group'});
    }));
  }
  const koMap={r32:KO.r32,r16:KO.r16,qf:KO.qf,sf:KO.sf};
  Object.entries(koMap).forEach(([key,matches])=>{
    if(!calFilter[key]) return;
    matches.forEach(m=>{
      if(!m.kickoff) return;
      events.push({home:m.home,away:m.away,start:m.kickoff,venue:m.venue,city:m.city,type:key});
    });
  });
  if(calFilter.final){
    events.push({home:'TBD — SF Loser 1',away:'TBD — SF Loser 2',start:'2026-07-18T21:00:00Z',venue:'Hard Rock Stadium',city:'Miami, FL',type:'final'});
    events.push({home:'TBD — SF Winner 1',away:'TBD — SF Winner 2',start:'2026-07-19T19:00:00Z',venue:'MetLife Stadium',city:'East Rutherford, NJ',type:'final'});
  }
  return events.sort((a,b)=>new Date(a.start)-new Date(b.start));
}

// Build full ICS file content
function buildICS(events){
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//WC2026 Tracker//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:⚽ FIFA World Cup 2026\r\nX-WR-CALDESC:Match schedule for the 2026 FIFA World Cup\r\nX-WR-TIMEZONE:UTC\r\n';
  events.forEach(e=>ics+=makeVEvent(e.home,e.away,e.start,e.venue,e.city));
  ics+='END:VCALENDAR\r\n';
  return ics;
}

// Get the live ICS feed URL (hosted on Cloudflare Pages)
function getIcsUrl(){
  const base = SITE_URL.trim() || window.location.origin;
  return base + '/schedule.ics';
}
function getWebcalUrl(){
  return getIcsUrl().replace(/^https?:\/\//,'webcal://');
}

// Download a locally-generated .ics as fallback
function downloadICS(events,filename='wc2026-schedule.ics'){
  const content=buildICS(events);
  const blob=new Blob([content],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// Subscribe via webcal:// — Apple Calendar treats this as a live feed
function openAppleCalendar(){
  window.location.href = getWebcalUrl();
}

// Open Google Calendar subscription dialog
function openGoogleCalendar(){
  const url = `https://calendar.google.com/calendar/r?cid=${encodeURIComponent(getWebcalUrl())}`;
  window.open(url, '_blank', 'noopener');
}

// Open Outlook subscription dialog
function openOutlookCalendar(){
  const url = `https://outlook.live.com/calendar/0/addcalendar?url=${encodeURIComponent(getIcsUrl())}`;
  window.open(url, '_blank', 'noopener');
}

// Single-event: pop a small sheet with Add to Apple/Google/Outlook/Download
function addSingleEvent(home,away,kickoff,venue,city){
  const events=[{home,away,start:kickoff,venue,city}];
  const content=buildICS(events);
  const blob=new Blob([content],{type:'text/calendar;charset=utf-8'});
  const blobUrl=URL.createObjectURL(blob);
  const startDt=icsDate(kickoff);
  const endDt=icsDate(new Date(new Date(kickoff).getTime()+105*60000).toISOString());
  const gTitle=encodeURIComponent(`⚽ ${home} vs ${away}`);
  const gLoc=encodeURIComponent(`${venue}, ${city}`);
  const gDetails=encodeURIComponent(`FIFA World Cup 2026\n${home} vs ${away}`);
  const gUrl=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${gTitle}&dates=${startDt}/${endDt}&location=${gLoc}&details=${gDetails}`;
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:#00000088;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  modal.innerHTML=`<div style="background:#0e1f11;border:1px solid #2d5235;border-radius:12px;padding:20px;max-width:340px;width:100%">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:#fff;margin-bottom:2px">📅 Add Match</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">${home} vs ${away}</div>
    <div style="background:#071409;border-radius:7px;padding:9px 12px;margin-bottom:10px;border:1px solid #2d5235">
      <div style="font-size:9px;font-weight:700;color:var(--green);letter-spacing:.1em;margin-bottom:3px">💡 SUBSCRIBE TO ALL MATCHES</div>
      <div style="font-size:11px;color:var(--muted)">Go to the <strong style="color:var(--text)">📅 CALENDAR</strong> tab to subscribe to the full live feed — all 104 matches, auto-updating in iCloud.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:7px">
      <a href="${blobUrl}" download="wc2026-match.ics" style="display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:7px;background:#1c3a24;color:#4ade80;border:1px solid #2d5235;font-size:12px;font-weight:600;text-decoration:none">
        🍎 Apple Calendar — add this match
      </a>
      <a href="${gUrl}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:7px;background:#1a2a3e;color:#60a5fa;border:1px solid #1e3a5f;font-size:12px;font-weight:600;text-decoration:none">
        📅 Google Calendar — add this match
      </a>
      <a href="${blobUrl}" download="wc2026-match.ics" style="display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:7px;background:#2a1a00;color:#fcd34d;border:1px solid #78350f55;font-size:12px;font-weight:600;text-decoration:none">
        ⬇️ Download .ics — Outlook &amp; others
      </a>
    </div>
    <button onclick="this.closest('[style*=fixed]').remove()" style="margin-top:12px;width:100%;padding:7px;border-radius:6px;background:#071409;border:1px solid var(--card-border);color:var(--muted);font-size:12px;cursor:pointer">Close</button>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
  setTimeout(()=>URL.revokeObjectURL(blobUrl),30000);
}

function toggleCalFilter(key){
  calFilter[key]=!calFilter[key];
  render('calendar');
}

function renderCalendar(){
  const allEvents=getFilteredMatches();
  let h=stageHdr('CALENDAR SYNC','Export the full schedule to Apple Calendar, Google Calendar, or Outlook');

  // Hero — live subscription section
  const icsUrl=typeof getIcsUrl==='function'?getIcsUrl():'[deploy site first]';
  const webcalUrl=typeof getWebcalUrl==='function'?getWebcalUrl():'[deploy site first]';
  const gcalSubUrl=`https://calendar.google.com/calendar/r?cid=${encodeURIComponent(webcalUrl)}`;
  const outlookSubUrl=`https://outlook.live.com/calendar/0/addcalendar?url=${encodeURIComponent(icsUrl)}`;
  const siteReady=SITE_URL.trim().length>0;

  h+=`<div class="cal-hero">
    <div class="cal-hero-title">📅 Live Calendar Subscription</div>
    <div class="cal-hero-sub">${siteReady
      ? 'Subscribe once — your calendar app polls for updates automatically. New results, bracket updates, and schedule changes sync without you doing anything.'
      : '⚠️ Complete the Cloudflare Pages deploy first, then paste your site URL into <code style="color:#4ade80">SITE_URL</code> in index.html. Once set, the subscribe buttons below will work.'
    }</div>
    <div class="cal-buttons">
      <a class="cal-btn cal-btn-apple" href="${webcalUrl}" ${siteReady?'':'style="opacity:.45;pointer-events:none"'}>🍎 Subscribe in Apple Calendar</a>
      <a class="cal-btn cal-btn-google" href="${gcalSubUrl}" target="_blank" rel="noopener" ${siteReady?'':'style="opacity:.45;pointer-events:none"'}>📅 Subscribe in Google Calendar</a>
      <a class="cal-btn cal-btn-outlook" href="${outlookSubUrl}" target="_blank" rel="noopener" ${siteReady?'':'style="opacity:.45;pointer-events:none"'}>📧 Subscribe in Outlook</a>
      <button class="cal-btn cal-btn-ics" onclick="downloadICS(getFilteredMatches())">⬇️ Download .ics (one-time)</button>
    </div>
    ${siteReady?`<div style="margin-top:10px;background:#071409;border-radius:6px;padding:7px 10px;font-size:10px;color:var(--dim);word-break:break-all">
      📡 Feed URL: <span style="color:#4ade80">${icsUrl}</span>
    </div>`:''}
  </div>`;

  // How iCloud live sync works
  h+=`<div class="cal-filter-wrap" style="margin-bottom:12px;background:#0b1f0e22">
    <div class="cal-filter-title">🔄 HOW LIVE ICLOUD SYNC WORKS</div>
    <div style="font-size:11px;color:var(--muted);line-height:1.8">
      <b style="color:var(--text)">iPhone/iPad:</b> Tap "Subscribe in Apple Calendar" → tap Subscribe → it creates a live calendar. Apple polls the feed every 1–24 hours automatically.<br>
      <b style="color:var(--text)">Mac:</b> Click "Subscribe in Apple Calendar" → File → New Calendar Subscription → confirms with your iCloud account → syncs to all Apple devices.<br>
      <b style="color:var(--text)">Manual URL entry:</b> Open Calendar → File → New Calendar Subscription → paste <code style="color:#4ade80">${siteReady?icsUrl:'your-site.pages.dev/schedule.ics'}</code><br>
      <b style="color:var(--text)">What updates:</b> Match scores, Final/3rd Place teams, and any time changes push automatically. Apple Calendar checks every 1–24 hours.
    </div>
  </div>`;

  // Filters
  const filters=[
    {key:'group',label:'Group Stage'},
    {key:'r32',label:'Round of 32'},
    {key:'r16',label:'Round of 16'},
    {key:'qf',label:'Quarterfinals'},
    {key:'sf',label:'Semifinals'},
    {key:'final',label:'Final & 3rd Place'},
  ];
  if(favTeam) filters.unshift({key:'favOnly',label:`${FLAGS[favTeam]||'⭐'} ${favTeam} only`});

  h+=`<div class="cal-filter-wrap">
    <div class="cal-filter-title">FILTER MATCHES</div>
    <div class="cal-filter-btns">`;
  filters.forEach(f=>{
    h+=`<button class="cal-f-btn${calFilter[f.key]?' on':''}" onclick="toggleCalFilter('${f.key}')">${f.label}</button>`;
  });
  h+=`</div>
    <div style="font-size:10px;color:var(--dim);margin-top:8px">${allEvents.length} match${allEvents.length!==1?'es':''} selected</div>
  </div>`;

  if(!allEvents.length){
    h+=`<div class="cal-empty">No matches match the current filter. Toggle some filters above.</div>`;
    return h;
  }

  // Group by date for display
  const byDate={};
  allEvents.forEach(e=>{
    const d=new Date(e.start);
    const key=d.toLocaleDateString('en-US',{timeZone:DISPLAY_TZ,weekday:'short',month:'short',day:'numeric'});
    if(!byDate[key]) byDate[key]=[];
    byDate[key].push(e);
  });

  h+=`<div class="cal-event-list">`;
  Object.entries(byDate).forEach(([dateLabel,events])=>{
    h+=`<div class="cal-section-hdr">${dateLabel}</div>`;
    events.forEach(e=>{
      const kt=fmtTime(e.start);
      const sc=getScore(e.home,e.away);
      const badge=sbadge(sc);
      h+=`<div class="cal-event">
        <div>
          <div class="cal-event-date">${kt||''}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div class="cal-event-teams">${fl(e.home)} <span style="color:var(--dim)">vs</span> ${fl(e.away)} ${badge}</div>
          <div class="cal-event-meta">📍 ${e.venue} · ${e.city}</div>
        </div>
        <button class="cal-add-btn" onclick="addSingleEvent('${e.home.replace(/'/g,"\\'")}','${e.away.replace(/'/g,"\\'")}','${e.start}','${e.venue.replace(/'/g,"\\'")}','${e.city.replace(/'/g,"\\'")}')">📅 Add</button>
      </div>`;
    });
  });
  h+='</div>';
  return h;
}

// ── INIT ───────────────────────────────────────────────
(function(){
  // The odds pill is revealed by fetchOdds() only once odds actually load.
  render('groups');
  refreshAll();
})();
