# One-time setup for KOVA OS device sync.
#
# Run manually (Actions → "KOVA sync setup (one-time)" → Run workflow). It:
#   1. creates the KOVA_SYNC Workers KV namespace (no-op if it already exists)
#   2. inserts the binding into wrangler.jsonc and commits it
#   3. redeploys the Worker with the new binding
#   4. smoke-tests /api/sync/ping on the live site
#
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the
# deploy workflow. If step 1 fails with an authorization error, add the
# "Workers KV Storage: Edit" permission to that API token in the Cloudflare
# dashboard and re-run.

name: KOVA sync setup (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Create (or find) the KOVA_SYNC KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Create is idempotent-by-intent: an "already exists" failure is fine.
          npx --yes wrangler@4 kv namespace create KOVA_SYNC || echo "create skipped (may already exist)"
          npx --yes wrangler@4 kv namespace list > /tmp/ns-raw.txt 2>/dev/null || true
          ID=$(node -e '
            const raw = require("fs").readFileSync("/tmp/ns-raw.txt", "utf8");
            const start = raw.indexOf("["), end = raw.lastIndexOf("]");
            if (start < 0 || end < 0) { console.error("could not parse namespace list:\n" + raw); process.exit(1); }
            const list = JSON.parse(raw.slice(start, end + 1));
            const ns = list.find(n => (n.title || "").endsWith("KOVA_SYNC"));
            if (!ns) { console.error("KOVA_SYNC namespace not found in list"); process.exit(1); }
            console.log(ns.id);
          ')
          echo "Namespace id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Insert the binding into wrangler.jsonc
        run: |
          node -e '
            const fs = require("fs");
            const id = process.env.KV_ID;
            let s = fs.readFileSync("wrangler.jsonc", "utf8");
            if (s.includes("\"kv_namespaces\"")) { console.log("binding already present — nothing to do"); process.exit(0); }
            const anchor = "\"assets\":";
            if (!s.includes(anchor)) { console.error("could not find assets anchor in wrangler.jsonc"); process.exit(1); }
            s = s.replace(anchor, `"kv_namespaces": [{ "binding": "KOVA_SYNC", "id": "${id}" }],\n  ${anchor}`);
            fs.writeFileSync("wrangler.jsonc", s);
            console.log("binding inserted");
          '
        env:
          KV_ID: ${{ steps.kv.outputs.id }}

      - name: Commit updated config
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git diff --staged --quiet || git commit -m "Enable KOVA OS device-sync KV binding [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with the new binding
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Smoke-test the sync endpoint
        run: |
          set -e
          for i in 1 2 3 4 5; do
            BODY=$(curl -s https://wc2026-tracker.aarondweymann.workers.dev/api/sync/ping || true)
            echo "attempt $i → $BODY"
            echo "$BODY" | grep -q '"enabled":true' && { echo "✓ sync live"; exit 0; }
            sleep 5
          done
          echo "✗ sync endpoint did not come up"; exit 1
